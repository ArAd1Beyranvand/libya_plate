name: libya_plate
description: "Libya's licence plates for the plate_core library — the 2013 series in one and two rows: private, foreign-owned, diplomatic and the five lettered yellow classes, with their themes and an advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/libya_plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
